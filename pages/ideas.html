
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>¿Qué tejer hoy? | Hilos Creativos</title>

    <!-- CONEXIÓN CON CSS -->
    <link rel="stylesheet" href="../style.css">
</head>

<body style="background-color: #fbe6ec;">

    <!-- =====================================
         ENCABEZADO
    ===================================== -->

    <header class="encabezado-crear">

        <h1>🧶 Hilos Creativos</h1>

        <!-- BOTONES DE NAVEGACIÓN -->
        <nav class="nav-ideas">

            <a href="../index.html" class="boton-nav">
                ♡ Inicio
            </a>

            <a href="crear.html" class="boton-nav">
                🧸 Crear peluche
            </a>

            <a href="patrones.html" class="boton-nav">
                🧶 Patrones
            </a>

            <a href="ideas.html" class="boton-nav">
                ✨ Ideas
            </a>

        </nav>

    </header>


    <!-- =====================================
         CONTENIDO PRINCIPAL
    ===================================== -->

    <main class="pagina-ideas">

        <!-- TÍTULO -->
        <section class="titulo-ideas">

            <h2>♡ ¿Qué tejer hoy? ♡</h2>

            <p>
                ¿No sabes qué crear?
                ¡Déjate sorprender por una idea adorable!
            </p>

        </section>


        <!-- =====================================
             GENERADOR DE IDEAS
        ===================================== -->

        <div class="tarjeta-idea">

            <!-- IMAGEN DEL PELUCHE -->
            <div class="imagen-idea">

                <img
                    id="imagen-idea"
                    src="../ideas/cama rosa.png"
                    alt="Peluche sorpresa"
                >

            </div>


            <!-- NOMBRE DE LA IDEA -->
            <h3 id="nombre-idea">
                ♡ Tu próxima creación ♡
            </h3>


            <!-- INFORMACIÓN DEL PELUCHE -->
            <div class="informacion-idea">

                <p id="animal-idea">
                    Animal: ???
                </p>

                <p id="color-idea">
                    Color: ???
                </p>

                <p id="accesorio-idea">
                    Accesorio: ???
                </p>

            </div>


            <!-- BOTÓN GENERADOR -->
            <button id="generar-idea" type="button">
                ✨ Sorpréndeme ✨
            </button>

        </div>


        <!-- MENSAJE FINAL -->
        <p class="mensaje-ideas">
            ♡ Cada puntada es una nueva aventura ♡
        </p>

    </main>


    <!-- =====================================
         CONEXIÓN CON JAVASCRIPT
    ===================================== -->

    <script src="../ideas.js"></script>

</body>
</html>
